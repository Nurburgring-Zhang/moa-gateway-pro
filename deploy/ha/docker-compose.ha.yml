version: '3.8'

# MoA Gateway Pro — High Availability Deployment
# Targets: 99.99% SLA (<4.3 min downtime/month)
#
# v3.2.1 deployment-honesty notes:
# - The Python app holds process-global state (model pool, rate limiter,
#   in-memory caches): each backend must run --workers 1 (enforced in
#   Dockerfile.backend). Horizontal scale = more containers, not workers.
# - The app connects to Redis directly (no Sentinel client support);
#   the app URL therefore points at redis-master. The sentinel quorum
#   below provides failover for the Redis master itself.
# - Read-replica PostgreSQL support is NOT implemented in app code;
#   the fake replica service was removed rather than pretend.

services:
  # ====== Go Reverse Proxy (L7 Load Balancer) ======
  moa-proxy:
    build:
      context: ../../proxy
    ports:
      - "8080:8080"
    environment:
      - MOA_JWT_SECRET=${MOA_JWT_SECRET}
      - PROXY_RATE_LIMIT=1000
      - BACKEND_URLS=http://moa-backend-1:8000,http://moa-backend-2:8000,http://moa-backend-3:8000
    depends_on:
      moa-backend-1:
        condition: service_healthy
      moa-backend-2:
        condition: service_healthy
    # (v3.2.1: removed `deploy.replicas: 2` — it is Swarm-only and silently
    # ignored by docker compose. Use `docker compose up --scale` instead.)
    restart_policy:
      condition: on-failure
      max_attempts: 5
      delay: 5s
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ====== Backend Instances (scale horizontally) ======
  moa-backend-1:
    build:
      context: ../..
      dockerfile: deploy/ha/Dockerfile.backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://moa:${DB_PASSWORD}@postgres-primary:5432/moa_gateway
      # v3.2.1: app code has no read-replica support -> DATABASE_REPLICA_URL removed
      # v3.2.1: app has no Redis Sentinel client -> connect to master directly
      REDIS_URL: redis://redis-master:6379/0
      MOA_JWT_SECRET: ${MOA_JWT_SECRET}
      MOA_ADMIN_PASSWORD: ${MOA_ADMIN_PASSWORD}
      MOA_INSTANCE_ID: backend-1
      MOA_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 5

  moa-backend-2:
    build:
      context: ../..
      dockerfile: deploy/ha/Dockerfile.backend
    environment:
      <<: *backend_env
      MOA_INSTANCE_ID: backend-2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        max_attempts: 5

  moa-backend-3:
    build:
      context: ../..
      dockerfile: deploy/ha/Dockerfile.backend
    environment:
      <<: *backend_env
      MOA_INSTANCE_ID: backend-3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        max_attempts: 5

  # ====== PostgreSQL Primary ======
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moa_gateway
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure

  # ====== Redis Sentinel ======
  redis-master:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel:
    image: redis:7-alpine
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "26379:26379"

  redis-sentinel-2:
    image: redis:7-alpine
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7-alpine
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy

  # ====== Monitoring Stack ======
  prometheus:
    image: prom/prometheus:v2.50.0
    volumes:
      # v3.2.1 fix: config lives at deploy/prometheus.yml (monitoring/ never had one)
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # v3.2.1 fix: rule_files references alerts.yml — it must be mounted or
      # Prometheus aborts on startup with a missing rule file.
      - ../alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      # v3.2.1 fix: real provisioning — a dashboard provider + datasource
      # YAML are required for the dashboard to actually appear.
      - ../monitoring/grafana/provisioning/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ../monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/moa.json:ro
      - grafana_data:/var/lib/grafana

volumes:
  pg_primary_data:
  redis_master_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
