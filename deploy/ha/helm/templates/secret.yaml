apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moa-gateway-pro.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "moa-gateway-pro.name" . }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  admin-password: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
