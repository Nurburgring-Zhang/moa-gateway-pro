name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ Lint (fast gate) ============
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: |
          ruff check moa_gateway/ --output-format=github
      - name: Check formatting
        run: |
          ruff format --check moa_gateway/

  # ============ Type check ============
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install mypy pydantic
      - name: Run mypy
        run: |
          mypy moa_gateway/ --ignore-missing-imports

  # ============ Unit tests ============
  test:
    name: pytest (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # v3.2.1: install from requirements.txt (the verified manifest the
          # Docker image uses) + dev tools — CI now tests what ships.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Run tests with coverage
        env:
          MOA_ADMIN_PASSWORD: "CI#TestPass#2024"
          PYTHONPATH: .
          PYTHONIOENCODING: "utf-8"
        run: |
          # Import smoke test
          python -c "from moa_gateway.server import app; print('import OK')"
          # Pytest with coverage
          python -m pytest tests/ -q --tb=short --cov=moa_gateway --cov-report=xml --cov-report=term-missing --cov-fail-under=40

      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============ Go proxy (v3.2.1: the proxy previously never compiled in CI) ============
  go-proxy:
    name: Go proxy build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: Build
        working-directory: proxy
        run: |
          go build ./...
          go vet ./...
      - name: Test
        working-directory: proxy
        run: go test ./... -v

  # ============ Security audit ============
  audit:
    name: 敏感信息审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 默认凭证扫描
        run: |
          echo "=== admin_password 不应含 'admin' 默认值 ==="
          ! grep -rn "admin_password:\s*['\"]*admin['\"]*\b" moa_gateway/ config.yaml 2>/dev/null || (echo "::error::admin_password default found" && exit 1)
          echo "=== 不应包含 ctx.api_key 模板打印 ==="
          ! grep -rn "ctx\.api_key" moa_gateway/ || (echo "::error::ctx.api_key print found" && exit 1)
          echo "=== 不应包含 sk- 前缀真 key ==="
          if grep -rEn "sk-[a-zA-Z0-9]{20,}" moa_gateway/ scripts/ config.yaml 2>/dev/null; then
            echo "::error::real sk- key found in source"
            exit 1
          fi
          echo "=== 不应追踪 secret 文件 ==="
          if git ls-files | grep -E "\.(fernet_key|jwt_secret)$"; then
            echo "::error::secret file tracked"
            exit 1
          fi
          echo "=== 不应追踪 .db 文件 ==="
          if git ls-files | grep -E "\.db$|\.db-journal$"; then
            echo "::error::db file tracked"
            exit 1
          fi
          echo "✓ 全部通过"

  # ============ SAST (Static Application Security Testing) ============
  sast:
    name: Security scanning (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: pip install bandit pip-audit
      - name: Bandit (Python SAST)
        run: |
          bandit -r moa_gateway/ -ll -q --format json -o bandit-report.json || true
          bandit -r moa_gateway/ -ll -q
      - name: pip-audit (dependency vulnerabilities)
        # v3.2.1: audit failures now fail the build (was a no-op warning)
        run: |
          pip install -r requirements.txt
          pip-audit --strict --desc
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ============ Container Build + Smoke ============
  container:
    name: Docker build + smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, sast]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: moa-gateway-pro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (build + run + /health)
        run: bash scripts/container_smoke.sh moa-gateway-pro:${{ github.sha }}
