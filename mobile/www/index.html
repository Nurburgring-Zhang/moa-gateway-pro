<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="format-detection" content="telephone=no" />
  <title>MOA Gateway</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">

    <!-- ================= Lock gate (biometric / PIN) ================= -->
    <section id="view-lock" class="view" aria-label="解锁">
      <!-- populated by lock.ts :: initLockView -->
    </section>

    <!-- ================= Gateway setup ================= -->
    <section id="view-setup" class="view" aria-label="网关配置">
      <div id="setup-content" class="setup-wrap"></div>
    </section>

    <!-- ================= Main shell (bottom tabs) ================= -->
    <section id="view-main" class="view" aria-label="控制台">
      <main id="page-status" class="page" aria-label="状态"></main>
      <main id="page-dialogue" class="page" aria-label="对话"></main>
      <main id="page-settings" class="page" aria-label="设置"></main>

      <nav id="tabbar" aria-label="底部导航">
        <button id="tab-status" class="tab is-active" type="button" aria-selected="true">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 12h-4l-3 8-6-16-3 8H2" />
          </svg>
          <span class="tab-label">状态</span>
        </button>
        <button id="tab-dialogue" class="tab" type="button" aria-selected="false">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg>
          <span class="tab-label">对话</span>
        </button>
        <button id="tab-settings" class="tab" type="button" aria-selected="false">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span class="tab-label">设置</span>
        </button>
      </nav>
    </section>

    <!-- ================= Room chat overlay ================= -->
    <section id="view-room" class="view" aria-label="对话房间">
      <header class="room-header">
        <button id="room-back" class="icon-btn" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="room-header-text">
          <div id="room-title" class="room-header-title">对话</div>
          <div id="room-meta" class="room-header-meta"></div>
        </div>
      </header>
      <div id="stream-banner" class="stream-banner" role="status"></div>
      <div id="room-messages" class="room-messages" aria-live="polite"></div>
      <footer class="composer">
        <textarea id="room-input" class="composer-input" rows="1" maxlength="4000"
                  placeholder="输入消息，触发一轮多 AI 响应…" enterkeyhint="send"></textarea>
        <button id="room-send" class="icon-btn composer-send" type="button" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13" />
            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
          </svg>
        </button>
      </footer>
    </section>

  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
