[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-gateway-pro"
version = "3.1.1"
description = "Industrial-grade multi-model collaboration gateway - one OpenAI key for all LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mavis", email = "Mavis@moa.dev"},
]
keywords = ["ai", "llm", "gateway", "moa", "mixture-of-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "rich>=13.0",
    "typer>=0.12",
    "psutil>=5.9",
]

[project.scripts]
# 顶级 CLI 命令(装包后可用:moa-gateway --help)
moa-gateway = "moa_gateway.__main__:main"
moa-mcp = "moa_gateway.mcp_server:main"
moa = "moa_gateway.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
ui = [
    "flet>=0.27",
]
monitoring = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[tool.setuptools.packages.find]
include = ["moa_gateway*"]

# v3.1.1 audit P1-15 fix: ship non-Python data files in the wheel/sdist.
# The v3.1.0 wheel contained zero data files — pip installs lost prompt
# templates, builtin workflows, webui assets and param templates.
[tool.setuptools.package-data]
moa_gateway = [
    "prompts/**/*.md",
    "prompts/**/*.yaml",
    "workflows/builtin/*.yaml",
    "workflows/builtin/*.yml",
    "webui/**/*",
    "param_templates/*.yaml",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[project.urls]
Homepage = "https://github.com/Nurburgring-Zhang/moa-gateway-pro"
Repository = "https://github.com/Nurburgring-Zhang/moa-gateway-pro.git"
Issues = "https://github.com/Nurburgring-Zhang/moa-gateway-pro/issues"

# ============ Ruff (linter + formatter) ============
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data",
    "参考",
    "extracted",
    "zip",
    "scripts/_*.py",  # one-off debug scripts
]

[tool.ruff.lint]
# Strict but practical: catches real bugs, ignores pedantic style issues
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort
    "B",   # bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # use pathlib
    "ERA", # eradicate commented-out code
    "PL",  # pylint
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "PLR0913", # too many arguments (FastAPI handlers)
    "PLR2004", # magic value (test files)
    "SIM108",  # use ternary (sometimes clearer with if/else)
    "PTH123",  # open() vs Path (allow builtin)
    "UP007",   # Optional[X] -> X | None (pydantic v1 compat)
    # P3 工程债: 以下为代码风格建议,非功能性bug,降低优先级
    "PTH100",  # os.path.abspath -> Path.resolve
    "PTH101",  # os.chmod -> Path.chmod
    "PTH102",  # os.mkdir -> Path.mkdir
    "PTH103",  # os.makedirs -> Path.mkdir(parents=True)
    "PTH104",  # os.rename -> Path.rename
    "PTH105",  # os.replace -> Path.replace
    "PTH106",  # os.rmdir -> Path.rmdir
    "PTH107",  # os.remove -> Path.unlink
    "PTH108",  # os.unlink -> Path.unlink
    "PTH109",  # os.getcwd -> Path.cwd
    "PTH110",  # os.path.exists -> Path.exists
    "PTH111",  # os.path.expanduser -> Path.expanduser
    "PTH112",  # os.path.isdir -> Path.is_dir
    "PTH113",  # os.path.isfile -> Path.is_file
    "PTH114",  # os.path.islink -> Path.is_symlink
    "PTH115",  # os.readlink -> Path.readlink
    "PTH116",  # os.stat -> Path.stat
    "PTH117",  # os.path.isabs -> Path.is_absolute
    "PTH118",  # os.path.join -> Path / operand
    "PTH119",  # os.path.basename -> Path.name
    "PTH120",  # os.path.dirname -> Path.parent
    "PTH121",  # os.path.samefile -> Path.samefile
    "PTH122",  # os.path.splitext -> Path.suffix
    "PTH202",  # os.path.getsize -> Path.stat
    "PTH204",  # os.path.getmtime -> Path.stat
    "PTH206",  # os.sep -> os.altsep
    "PTH208",  # os.listdir -> Path.iterdir
    "PLW0108", # unnecessary-lambda
    "PLC0206", # dict-index-missing-items
    "PLR1714", # repeated-equality-comparison
    "PLW0602", # global-variable-not-assigned
    "SIM103",  # needless-bool
    "SIM105",  # contextlib.suppress
    "SIM110",  # any/all loop -> return
    "SIM114",  # if-else with same body
    "SIM115",  # open-file-with-context-handler
    "SIM117",  # nested with
    "SIM118",  # key in dict.keys() -> key in dict
    "C401",    # unnecessary-generator-set
    "C402",    # unnecessary-generator-dict
    "C408",    # unnecessary-collection-call
    "B905",    # zip-without-explicit-strict (large refactor)
    "ERA001",  # commented-out code (may be intentional)
    # Lazy import is intentional pattern in FastAPI (avoid circular imports, startup speed)
    "PLC0415", # import-outside-top-level
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLW0603", # global-statement (singleton pattern)
    "PLW2901", # redefined-loop-name
    "PLW1510", # subprocess-run-without-check
    "SIM102",  # collapsible-if
    "SIM116",  # if-else-block-instead-of-dict-lookup
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B", "PLR2004", "SIM", "E402"]
"scripts/test_*.py" = ["B", "PLR2004", "SIM", "E402", "PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============ Mypy (type checker) ============
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # too strict for current code, allow gradual typing
disallow_incomplete_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "scripts/_",
    "scripts/test_",
    "extracted/",
    "参考/",
    "data/",
    "build/",
    "dist/",
]

# ============ Pytest ============
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::PendingDeprecationWarning",
]

# ============ Coverage ============
[tool.coverage.run]
source = ["moa_gateway"]
omit = [
    "moa_gateway/capability/tests/*",
    "scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "\\.\\.\\.",
]
show_missing = true
precision = 2
